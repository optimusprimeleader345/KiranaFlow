<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">KiranaFlow: End-to-End System Architecture</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">AI Order Capture, Fuzzy Match Threshold Engine, Safety Lock, and Role Management</text>

  <!-- Step 1: Retailer Input -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="200" height="150" rx="14" fill="url(#gradDark)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#38bdf8" font-size="16">🛒</text>
    <text x="65" y="40" fill="#f8fafc" font-size="15" font-weight="600">1. Retailer Input</text>
    <rect x="20" y="65" width="160" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="85" fill="#94a3b8" font-family="monospace" font-size="11">10 ctn parle-g</text>
    <text x="30" y="103" fill="#94a3b8" font-family="monospace" font-size="11">5 surf excel 1kg</text>
    <text x="30" y="121" fill="#94a3b8" font-family="monospace" font-size="11">2 dz maggi</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 250 185 L 320 185" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <polygon points="320,185 310,180 310,190" fill="#38bdf8"/>

  <!-- Step 2: Extraction Tier -->
  <g transform="translate(330, 110)" filter="url(#shadow)">
    <rect width="220" height="230" rx="14" fill="url(#gradDark)" stroke="#818cf8" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#818cf8" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#818cf8" font-size="16">🧠</text>
    <text x="65" y="40" fill="#f8fafc" font-size="15" font-weight="600">2. Extraction Layer</text>

    <!-- Sub-box LLM -->
    <rect x="20" y="65" width="180" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="32" y="88" fill="#a5b4fc" font-size="13" font-weight="600">OpenAI LLM Call</text>
    <text x="32" y="108" fill="#c7d2fe" font-size="11">Single call + Zod Schema</text>

    <!-- Fallback indicator -->
    <text x="110" y="148" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">⚡ On Failure / Timeout</text>

    <!-- Sub-box Regex Fallback -->
    <rect x="20" y="160" width="180" height="60" rx="8" fill="#451a03" stroke="#d97706"/>
    <text x="32" y="183" fill="#fcd34d" font-size="13" font-weight="600">Regex Fallback Engine</text>
    <text x="32" y="203" fill="#fde68a" font-size="11">Line-splitter + UI Banner</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 550 185 L 610 185" stroke="#818cf8" stroke-width="2.5" fill="none"/>
  <polygon points="610,185 600,180 600,190" fill="#818cf8"/>

  <!-- Step 3: Fuzzy Matching & Unit Normalization -->
  <g transform="translate(620, 110)" filter="url(#shadow)">
    <rect width="210" height="230" rx="14" fill="url(#gradDark)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#a855f7" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#a855f7" font-size="16">🔍</text>
    <text x="65" y="40" fill="#f8fafc" font-size="15" font-weight="600">3. Match Engine</text>

    <!-- Unit Normalization -->
    <rect x="15" y="65" width="180" height="42" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="25" y="85" fill="#e2e8f0" font-size="11" font-weight="600">Unit Normalization</text>
    <text x="25" y="99" fill="#94a3b8" font-size="10">ctn ➔ carton, dz ➔ dozen (12x)</text>

    <!-- Fuse.js Thresholds -->
    <rect x="15" y="115" width="180" height="100" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="25" y="133" fill="#34d399" font-size="11" font-weight="600">Score ≥ 0.85 ➔ Matched</text>
    <text x="25" y="153" fill="#fbbf24" font-size="11" font-weight="600">0.50–0.85 ➔ Needs Review</text>
    <text x="35" y="168" fill="#94a3b8" font-size="10">Top-3 SKU suggestions</text>
    <text x="25" y="188" fill="#f87171" font-size="11" font-weight="600">Score &lt; 0.50 ➔ Not Found</text>
    <text x="35" y="203" fill="#94a3b8" font-size="10">Manual SKU selection pick</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 830 185 L 880 185" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <polygon points="880,185 870,180 870,190" fill="#a855f7"/>

  <!-- Step 4: Review Screen & Safety Lock -->
  <g transform="translate(890, 110)" filter="url(#shadow)">
    <rect width="170" height="230" rx="14" fill="url(#gradDark)" stroke="#34d399" stroke-width="2"/>
    <circle cx="30" cy="35" r="16" fill="#34d399" fill-opacity="0.2"/>
    <text x="30" y="41" text-anchor="middle" fill="#34d399" font-size="16">🛡️</text>
    <text x="55" y="40" fill="#f8fafc" font-size="14" font-weight="600">4. Review Screen</text>

    <rect x="15" y="65" width="140" height="50" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="25" y="86" fill="#a7f3d0" font-size="11" font-weight="600">Flagged Lines UI</text>
    <text x="25" y="103" fill="#6ee7b7" font-size="10">Color + Icon + Reason</text>

    <!-- Safety Lock Box -->
    <rect x="15" y="125" width="140" height="90" rx="6" fill="#450a0a" stroke="#ef4444"/>
    <text x="25" y="147" fill="#fca5a5" font-size="11" font-weight="700">Safety Lock 🔒</text>
    <text x="25" y="167" fill="#fecaca" font-size="10">"Confirm" disabled</text>
    <text x="25" y="182" fill="#fecaca" font-size="10">until flagged lines</text>
    <text x="25" y="197" fill="#fecaca" font-size="10">are resolved!</text>
  </g>

  <!-- Downward Arrow from Step 4 to Order Persistence -->
  <path d="M 975 340 L 975 420 L 730 420" stroke="#34d399" stroke-width="2.5" fill="none"/>
  <polygon points="730,420 740,415 740,425" fill="#34d399"/>

  <!-- Step 5: Database & Persistence -->
  <g transform="translate(480, 380)" filter="url(#shadow)">
    <rect width="240" height="150" rx="14" fill="url(#gradDark)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#38bdf8" font-size="16">💾</text>
    <text x="65" y="40" fill="#f8fafc" font-size="15" font-weight="600">5. Order Persistence</text>

    <text x="25" y="75" fill="#94a3b8" font-size="12">• Server Role Guard (RETAILER)</text>
    <text x="25" y="95" fill="#94a3b8" font-size="12">• Pricing Engine (Qty × Price)</text>
    <text x="25" y="115" fill="#94a3b8" font-size="12">• Prisma ORM (SQLite / Postgres)</text>
    <text x="25" y="135" fill="#94a3b8" font-size="12">• Orders + OrderLines Created</text>
  </g>

  <!-- Arrow from DB to Step 6 (Admin Dashboard) -->
  <path d="M 480 455 L 360 455" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
  <polygon points="360,455 370,450 370,460" fill="#f43f5e"/>

  <!-- Step 6: Distributor Admin Dashboard -->
  <g transform="translate(100, 380)" filter="url(#shadow)">
    <rect width="250" height="150" rx="14" fill="url(#gradDark)" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="35" y="41" text-anchor="middle" fill="#f43f5e" font-size="16">📊</text>
    <text x="65" y="40" fill="#f8fafc" font-size="15" font-weight="600">6. Admin Dashboard</text>

    <text x="25" y="75" fill="#94a3b8" font-size="12">• Server Role Guard (ADMIN)</text>
    <text x="25" y="95" fill="#94a3b8" font-size="12">• Cross-Retailer Aggregate KPIs</text>
    <text x="25" y="115" fill="#94a3b8" font-size="12">• Status Updates (Pending ➔ Delivered)</text>
    <text x="25" y="135" fill="#94a3b8" font-size="12">• Line Item Quantity &amp; Total Inspection</text>
  </g>

  <!-- Footer Banner -->
  <rect x="50" y="580" width="1010" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="555" y="605" text-anchor="middle" fill="#94a3b8" font-size="12">
    🛡️ Strict Safety Mandate: Zero silent data modifications | Never persist draft orders | Server-side role checks on every route
  </text>
</svg>
